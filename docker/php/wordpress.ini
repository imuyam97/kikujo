; PHP settings for WordPress development environment

; Memory
memory_limit = 256M

; Upload
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Execution
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; Error reporting (development)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Timezone
date.timezone = Asia/Tokyo

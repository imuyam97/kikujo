events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream wordpress {
        server wordpress:80;
    }

    upstream phpmyadmin {
        server phpmyadmin:80;
    }

    # Default server for unknown hosts
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # HTTP to HTTPS redirect - WordPress
    server {
        listen 80;
        server_name kikujo.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTP to HTTPS redirect - phpMyAdmin
    server {
        listen 80;
        server_name pma.kikujo.s325.xrea.com;
        return 301 https://$server_name$request_uri;
    }

    # WordPress - HTTPS
    server {
        listen 443 ssl;
        server_name kikujo.com;

        ssl_certificate /etc/nginx/ssl/sites/kikujo.crt;
        ssl_certificate_key /etc/nginx/ssl/sites/kikujo.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://wordpress;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            proxy_redirect off;
            proxy_buffering off;
        }
    }

    # phpMyAdmin - HTTPS
    server {
        listen 443 ssl;
        server_name pma.kikujo.s325.xrea.com;

        ssl_certificate /etc/nginx/ssl/sites/phpmyadmin.crt;
        ssl_certificate_key /etc/nginx/ssl/sites/phpmyadmin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://phpmyadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
